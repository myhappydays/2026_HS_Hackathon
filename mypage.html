<!DOCTYPE html>
<html lang="ko" data-theme="theme-crimson" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fermata">
  <title>마이페이지 - Fermata</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // 테마 CSS 변수를 Tailwind 색으로 등록한다. <alpha-value> 를 넣어야 bg-primary/10, border-border/60 같은
    // 투명도 표기가 동작한다. (빠지면 해당 클래스가 무시되어 테두리가 기본 회색(#e5e7eb)으로 보인다)
    const themeColor = (name) => `color-mix(in srgb, var(${name}) calc(<alpha-value> * 100%), transparent)`
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['var(--font-sans)', 'sans-serif'] },
          colors: {
            background: themeColor('--background'),
            'background-1': themeColor('--background-1'),
            foreground: themeColor('--foreground'),
            primary: { DEFAULT: themeColor('--primary'), 500: themeColor('--primary-500'), 600: themeColor('--primary-600') },
            muted: { DEFAULT: themeColor('--muted'), foreground: themeColor('--muted-foreground') },
            border: themeColor('--border'),
            surface: { DEFAULT: themeColor('--surface'), 1: themeColor('--surface-1') },
            card: { DEFAULT: themeColor('--card') }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/themes/crimson.css">
  <style>
    body { font-family: var(--font-sans); }
    /* 메인 화면과 같은 헤더(글래스)·앱 래퍼 그림자·스크롤바 */
    header {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: color-mix(in oklch, var(--background) 85%, transparent) !important;
      border-bottom-color: color-mix(in oklch, var(--border) 60%, transparent) !important;
    }
    .app-wrapper {
      box-shadow:
        0 0 0 1px color-mix(in oklch, var(--border) 50%, transparent),
        0 20px 60px -10px rgba(0,0,0,0.18),
        0 4px 16px -4px rgba(0,0,0,0.08);
    }
    * { scrollbar-width: thin; scrollbar-color: var(--surface-2) transparent; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 9999px; }
  </style>
</head>
<body class="bg-background text-foreground min-h-screen">

  <div class="app-wrapper w-full max-w-[430px] mx-auto min-h-screen border-x border-border bg-background flex flex-col">

    <!-- 헤더 -->
    <header class="sticky top-0 z-50 bg-background/95 backdrop-blur-md border-b border-border px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a id="nav-home" href="#" class="w-8 h-8 rounded-lg border border-border bg-surface flex items-center justify-center text-muted-foreground hover:text-foreground hover:border-primary/50 transition-all shadow-sm" title="홈으로" aria-label="홈으로">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
          </svg>
        </a>
        <h1 class="font-bold text-base text-foreground">마이페이지</h1>
      </div>
      <button id="logout-btn" type="button"
        class="inline-flex items-center gap-1.5 py-1.5 px-2.5 rounded-lg border border-border bg-surface text-muted-foreground hover:text-foreground hover:border-primary/50 text-xs font-medium transition-all shadow-sm whitespace-nowrap shrink-0"
        title="로그아웃">
        <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/>
        </svg>
        <span>로그아웃</span>
      </button>
    </header>

    <main class="flex-1 overflow-y-auto pb-10">

      <!-- 프로필 영역 -->
      <div class="mx-4 mt-4 p-4 rounded-xl border border-border bg-card flex items-center justify-between gap-4">
        <div class="flex items-center gap-3.5 min-w-0">
          <img id="profile-img" src="/icon.svg" class="w-14 h-14 rounded-full object-cover border border-border bg-surface shrink-0" alt="프로필">
          <div class="min-w-0">
            <h2 id="profile-name" class="text-base font-bold text-foreground truncate">로딩 중...</h2>
            <p id="profile-email" class="text-xs text-muted-foreground truncate"></p>
          </div>
        </div>
      </div>

      <!-- 리스트 헤더 -->
      <div class="px-4 pt-5 pb-1 flex items-center justify-between">
        <h3 class="font-semibold text-base text-foreground">내가 쓴 제보</h3>
        <span id="my-report-count" class="text-xs text-muted-foreground">총 0건</span>
      </div>

      <!-- 내가 쓴 제보 리스트 -->
      <div id="my-report-list" class="px-4 py-2 flex flex-col gap-3">
        <!-- JS로 동적 렌더링 -->
      </div>

      <!-- 빈 상태 UI -->
      <div id="empty-state" class="hidden flex-col items-center justify-center py-16 gap-3">
        <div class="w-14 h-14 rounded-full bg-surface flex items-center justify-center">
          <svg class="w-7 h-7 text-muted-foreground" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/>
          </svg>
        </div>
        <p class="text-sm text-muted-foreground text-center">작성한 제보가 없습니다.</p>
      </div>

      <!-- 정책 및 계정 관리 -->
      <section class="mx-4 mt-8 pt-6 border-t border-border space-y-3">
        <div class="flex items-center justify-center gap-4 text-xs text-muted-foreground">
          <a id="nav-privacy" href="privacy.html" class="hover:text-foreground underline underline-offset-4 transition">개인정보처리방침</a>
          <span class="opacity-40">|</span>
          <a id="nav-terms" href="terms.html" class="hover:text-foreground underline underline-offset-4 transition">이용약관·커뮤니티 방침</a>
        </div>
        <button id="delete-account-btn" type="button"
          class="w-full py-2.5 px-4 rounded-xl border border-red-500/30 bg-red-500/5 hover:bg-red-500/15 text-red-500 text-xs font-semibold transition-all flex items-center justify-center gap-1.5">
          <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/>
          </svg>
          <span>계정 삭제 (회원 탈퇴)</span>
        </button>
      </section>

    </main>
  </div>

  <script type="module" src="/src/mypage.js"></script>
</body>
</html>
