<!DOCTYPE html>
<html lang="ko" data-theme="theme-crimson" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관제 대시보드 - Fermata</title>
  <link rel="icon" href="/2026_HS_Hackathon/favicon.ico" sizes="any">
  <link rel="icon" href="/2026_HS_Hackathon/icon.svg" type="image/svg+xml">
  
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['var(--font-sans)', 'sans-serif'] },
          colors: {
            background: 'var(--background)',
            'background-1': 'var(--background-1)',
            foreground: 'var(--foreground)',
            primary: { DEFAULT: 'var(--primary)', 500: 'var(--primary-500)', 600: 'var(--primary-600)' },
            muted: { DEFAULT: 'var(--muted)', foreground: 'var(--muted-foreground)' },
            border: 'var(--border)',
            surface: { DEFAULT: 'var(--surface)', 1: 'var(--surface-1)' },
            card: { DEFAULT: 'var(--card)' }
          }
        }
      }
    }
  </script>
  <style>body { font-family: var(--font-sans); }</style>
  <script type="module" crossorigin src="/2026_HS_Hackathon/assets/admin-DUjykgSX.js"></script>
  <link rel="modulepreload" crossorigin href="/2026_HS_Hackathon/assets/utils-q2FoRUtQ.js">
  <link rel="modulepreload" crossorigin href="/2026_HS_Hackathon/assets/theme-BGQI_Gbl.js">
  <link rel="stylesheet" crossorigin href="/2026_HS_Hackathon/assets/utils-7lpI1uXZ.css">
</head>
<body class="bg-background-1 text-foreground min-h-screen flex flex-col">

  <!-- 헤더 -->
  <header class="bg-background border-b border-border px-6 py-4 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition">
        <img src="/2026_HS_Hackathon/icon.svg" class="w-8 h-8 rounded-lg" alt="Logo">
        <span class="font-bold text-xl tracking-tight">Fermata <span class="text-primary text-sm ml-1 px-2 py-0.5 bg-primary/10 rounded-full">지자체 관리자</span></span>
      </a>
    </div>
    <div class="flex items-center gap-4 text-sm font-medium">
      <span class="text-muted-foreground" id="current-time"></span>
      <a href="index.html" class="px-4 py-2 rounded-lg bg-surface border border-border hover:bg-surface-1 transition">시민 뷰(지도)로 돌아가기</a>
    </div>
  </header>

  <!-- 메인 콘텐츠 -->
  <main class="flex-1 p-6 md:p-8 max-w-7xl mx-auto w-full flex flex-col gap-8">
    
    <!-- 타이틀 영역 -->
    <div>
      <h1 class="text-2xl font-bold text-foreground">안전 관제 대시보드</h1>
      <p class="text-muted-foreground mt-1">지역 내 보고된 모든 위험 요소 현황을 모니터링합니다.</p>
    </div>

    <!-- 통계 요약 카드 (Grid) -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
      
      <!-- 총 제보 수 -->
      <div class="bg-background border border-border rounded-xl p-5 shadow-sm">
        <div class="flex items-center gap-3 mb-2">
          <div class="w-10 h-10 rounded-lg bg-surface flex items-center justify-center">
            <svg class="w-5 h-5 text-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          </div>
          <h3 class="font-medium text-muted-foreground">총 누적 제보</h3>
        </div>
        <p class="text-3xl font-bold" id="stat-total-reports">0</p>
      </div>

      <!-- 활성 위험 구역 (군집) -->
      <div class="bg-background border border-border rounded-xl p-5 shadow-sm relative overflow-hidden">
        <div class="absolute right-0 top-0 w-24 h-24 bg-red-500/10 rounded-bl-full -z-0"></div>
        <div class="flex items-center gap-3 mb-2 relative z-10">
          <div class="w-10 h-10 rounded-lg bg-red-500/20 flex items-center justify-center text-red-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
          </div>
          <h3 class="font-medium text-muted-foreground">미해결 위험 구역</h3>
        </div>
        <p class="text-3xl font-bold text-red-500 relative z-10" id="stat-active-clusters">0</p>
      </div>

      <!-- 초고위험 (High) 구역 -->
      <div class="bg-background border border-border rounded-xl p-5 shadow-sm relative overflow-hidden">
        <div class="absolute right-0 top-0 w-24 h-24 bg-orange-500/10 rounded-bl-full -z-0"></div>
        <div class="flex items-center gap-3 mb-2 relative z-10">
          <div class="w-10 h-10 rounded-lg bg-orange-500/20 flex items-center justify-center text-orange-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
          </div>
          <h3 class="font-medium text-muted-foreground">초고위험 (High)</h3>
        </div>
        <p class="text-3xl font-bold text-orange-500 relative z-10" id="stat-high-danger">0</p>
      </div>

      <!-- 해결 완료 -->
      <div class="bg-background border border-border rounded-xl p-5 shadow-sm relative overflow-hidden">
        <div class="absolute right-0 top-0 w-24 h-24 bg-blue-500/10 rounded-bl-full -z-0"></div>
        <div class="flex items-center gap-3 mb-2 relative z-10">
          <div class="w-10 h-10 rounded-lg bg-blue-500/20 flex items-center justify-center text-blue-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </div>
          <h3 class="font-medium text-muted-foreground">해결 완료</h3>
        </div>
        <p class="text-3xl font-bold text-blue-500 relative z-10" id="stat-resolved">0</p>
      </div>

    </div>

    <!-- 메인 대시보드 하단 영역 (차트 및 리스트) -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-1">
      
      <!-- 분야별 위험 현황 (비율) -->
      <div class="lg:col-span-1 bg-background border border-border rounded-xl p-5 shadow-sm flex flex-col">
        <h3 class="font-bold text-lg mb-4">분야별 미해결 현황</h3>
        <div id="category-stats" class="flex flex-col gap-4 flex-1 overflow-y-auto">
          <!-- 동적 렌더링 -->
          <div class="flex items-center justify-center h-full text-muted-foreground text-sm">데이터를 불러오는 중...</div>
        </div>
      </div>

      <!-- 시급 조치 필요 구역 리스트 -->
      <div class="lg:col-span-2 bg-background border border-border rounded-xl shadow-sm flex flex-col overflow-hidden">
        <div class="px-5 py-4 border-b border-border flex items-center justify-between bg-surface/30">
          <h3 class="font-bold text-lg flex items-center gap-2">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
            </span>
            시급 조치 요망 구역 (High)
          </h3>
        </div>
        <div class="flex-1 overflow-x-auto">
          <table class="w-full text-left text-sm whitespace-nowrap">
            <thead class="bg-surface/50 text-muted-foreground border-b border-border">
              <tr>
                <th class="px-5 py-3 font-medium">분야</th>
                <th class="px-5 py-3 font-medium">위치 (대표 주소)</th>
                <th class="px-5 py-3 font-medium">공감 수</th>
                <th class="px-5 py-3 font-medium text-right">상세보기</th>
              </tr>
            </thead>
            <tbody id="urgent-list" class="divide-y divide-border">
              <!-- 동적 렌더링 -->
              <tr>
                <td colspan="4" class="px-5 py-8 text-center text-muted-foreground">로딩 중이거나 데이터가 없습니다.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

</body>
</html>
